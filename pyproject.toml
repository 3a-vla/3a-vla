[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gameeval"
version = "0.3.0"
description = "A Windows evaluation release for vision-language-action agents in 3A games"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "GameEval Team"},
]
keywords = ["evaluation-framework", "vla", "csgo", "gta5", "game-for-peace", "game-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: Microsoft :: Windows :: Windows 11",
]

dependencies = [
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "mss>=9.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
csgo = [
    "aiohttp>=3.9.0",
    "psutil>=5.9.0; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]
video = [
    "opencv-python-headless>=4.8.0",
]
windows = [
    "aiohttp>=3.9.0",
    "psutil>=5.9.0; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "opencv-python-headless>=4.8.0",
]
all = [
    "aiohttp>=3.9.0",
    "psutil>=5.9.0; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "opencv-python-headless>=4.8.0",
]

[project.scripts]
gameeval = "gameeval.cli:main"

[tool.setuptools.packages.find]
include = ["gameeval*"]

[tool.setuptools.package-data]
gameeval = [
    "configs/*.yaml",
    "configs/*/*.yaml",
    "configs/*/*/*.yaml",
    "configs/*/*.txt",
    "configs/*/*/*.txt",
    "configs/*/*.cfg",
    "configs/*/*/*.cfg",
]
